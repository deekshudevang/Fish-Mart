version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: efm-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=exotic_fish_mart
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: efm-backend
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/exotic_fish_mart
      - JWT_SECRET=exotic-fish-mart-secret-key-2024
      - JWT_REFRESH_SECRET=exotic-fish-mart-refresh-key-2024
      - PORT=5000
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: efm-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  admin:
    build: ./admin
    container_name: efm-admin
    ports:
      - "3001:3001"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
